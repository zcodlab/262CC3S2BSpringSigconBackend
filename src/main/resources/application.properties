spring.application.name=261CC3S2BSpringSigconBackend
spring.datasource.driver-class-name=org.postgresql.Driver
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
server.port=8080
jwt.secret=${TOKEN_JWT_SECRET}
logging.level.org.springframework.security=DEBUG
springdoc.swagger-ui.path=/docs
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}

# Auditoria
app.version=1.0.0
server.forward-headers-strategy=FRAMEWORK

#Actuator
# Habilitar endpoints de Actuator
management.endpoints.web.exposure.include=health,info,metrics,beans

# Mostrar detalles del estado de salud
management.endpoint.health.show-details=always

# Puerto de administración (opcional)
management.server.port=8081

# Configuracion de informacion de la aplicacion
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Backend del Sistema de Gestion de Condominios
info.app.version=1.0.0